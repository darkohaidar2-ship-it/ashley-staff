name: Ashley Shift Reminders Dispatcher

on:
  schedule:
    # 07:45 AM Baghdad (UTC+3) -> 04:45 UTC (Morning Shift 8-5 Start)
    - cron: '45 4 * * *'
    # 02:45 PM Baghdad (UTC+3) -> 11:45 UTC (Evening Shift 3-11 Start)
    - cron: '45 11 * * *'
    # 04:45 PM Baghdad (UTC+3) -> 13:45 UTC (Morning Shift 8-5 End)
    - cron: '45 13 * * *'
    # 10:45 PM Baghdad (UTC+3) -> 19:45 UTC (Evening Shift 3-11 End)
    - cron: '45 19 * * *'
  workflow_dispatch:

jobs:
  dispatch_reminder:
    name: Ping Shift Reminder Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Shift Reminders
        run: |
          echo "Triggering Ashley Shift Reminders at $(date -u)"
          curl -s -f -X GET "https://ashley-staff.vercel.app/api/cron/shift-reminders" || echo "Warning: Primary ping failed"
